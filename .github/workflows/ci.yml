name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      # Warnings are reported but do not fail the build yet (existing code has a few).
      - name: clippy (no tokio)
        run: cargo clippy --workspace --all-targets -- -W clippy::all
      - name: clippy (tokio feature)
        run: cargo clippy --workspace --all-targets --features poe-net/tokio -- -W clippy::all
      - name: test (no tokio)
        run: cargo test --workspace
      - name: test (tokio feature)
        run: cargo test --workspace --features poe-net/tokio
